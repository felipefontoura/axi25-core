# mise config for the axi25-source engine. mise users get python 3.13 + uv on `cd`, and can run
# the tasks below. `setup.sh`/`setup.ps1` auto-run `mise trust`, so the one-time trust prompt is
# handled for you. Non-mise users: `setup.sh` falls back to plain uv — mise is optional.
[tools]
python = "3.13"
uv = "latest"

# No ML caches to redirect (cloud-first): the old HF_HOME / TORCH_HOME / PYANNOTE_CACHE env block
# is gone — the skill uses OpenRouter + light pip deps.

[tasks.setup]
description = "Create the isolated venv (uv sync)"
run = "./setup.sh"

[tasks.source]
description = "Run the acquisition CLI — pass args after --, e.g. `mise run source -- --help`"
run = "uv run python source.py"

[tasks.test]
description = "Run the skill's unit tests"
run = "uv run python -m unittest discover -s tests"
